name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            external/WebGAL/node_modules
            external/WebGAL/packages/*/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json', 'external/WebGAL/yarn.lock') }}

      - name: Install root deps
        run: npm install

      - name: Bootstrap WebGAL (clone if missing)
        run: |
          if [ ! -d external/WebGAL ]; then
            git clone --depth 1 https://github.com/OpenWebGAL/WebGAL.git external/WebGAL
          fi

      - name: Install WebGAL deps
        run: |
          npm install -g yarn
          cd external/WebGAL && yarn install --network-concurrency 2

      - name: Generate library-demo with AI narrate
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npm run gen:ai-game src/scenarios/library-demo.json

      - name: Build dist
        run: cd external/WebGAL && yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: external/WebGAL/packages/webgal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
